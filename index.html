<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Minecraft Repo</title>
    <!-- Link to the external CSS file -->
    <link rel="stylesheet" href="style.css">
    <!-- Import a Minecraft-like pixel font from Google Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <div class="mc-container">
        <!-- Minecraft styled header block -->
        <header class="mc-header">
            <h1>MINECRAFT_GUI</h1>
            <p>Welcome to my GitHub repository page!</p>
        </header>

        <!-- Main content block styled like an in-game menu -->
        <main class="mc-menu">
            <section class="mc-card">
                <h2>Active Quest</h2>
                <p>Building a fully responsive pixel-art interface using HTML and CSS.</p>
            </section>

            <!-- Minecraft styled buttons -->
            <div class="mc-button-container">
                <a href="https://github.com" class="mc-btn">VIEW REPOSITORY</a>
                <a href="#" class="mc-btn mc-btn-stone">OPTIONS</a>
            </div>
        </main>
    </div>

</body>
</html>
